<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Signal Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-accent: #00ff00;
      --warning-accent: #ff3333;
      --text-color: #ffffff;
      --sub-text-color: #cccccc;
      --neon-shadow: 0 0 10px rgba(0, 255, 0, 0.7), 0 0 20px rgba(0, 255, 0, 0.5);
      --warning-shadow: 0 0 10px rgba(255, 51, 51, 0.7), 0 0 20px rgba(255, 51, 51, 0.5);
      --inner-shadow-color: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: transparent;
      color: var(--text-color);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }
    .status-container {
      text-align: center;
      background: #0e0e0e !important;
      padding: 30px 45px;
      border-radius: 20px;
      border: 2px solid var(--inner-shadow-color);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
      position: relative;
      transform: scale(1.35);
    }
    .status-container::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 2px solid var(--primary-accent);
      border-radius: 25px;
      box-shadow: var(--neon-shadow);
      z-index: -1;
      opacity: 0.8;
      pointer-events: none;
    }
    .header {
      margin-bottom: 15px;
    }
    .header h1 {
      font-size: 1.6em;
      margin: 0;
      color: var(--primary-accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      text-shadow: 0 0 10px var(--primary-accent);
    }
    .header p {
      font-size: 0.8em;
      color: var(--text-color);
      margin: 4px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
    }
    .status-box {
      font-weight: 700;
      font-size: 2.2em;
      color: var(--text-color);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 12px 30px;
      display: inline-flex;
      gap: 15px;
      margin: 10px 0;
      position: relative;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .status-box::after {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border: 2px solid var(--primary-accent);
      border-radius: 12px;
      box-shadow: var(--neon-shadow);
      z-index: -1;
      opacity: 0.6;
    }
    .subtext {
      font-size: 0.95em;
      color: var(--text-color);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
      margin-top: 10px;
    }
    .dots {
      display: inline-block;
      width: 1.5em;
      text-align: left;
    }
    .dot {
      opacity: 0;
      animation: dot-pulse 1.5s infinite;
    }
    .dot1 { animation-delay: 0s; }
    .dot2 { animation-delay: 0.3s; }
    .dot3 { animation-delay: 0.6s; }
    @keyframes dot-pulse {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Červené neonové zvýraznění pro výpadek signálu */
    .signal-lost::after, .signal-lost .status-box::after {
      border-color: var(--warning-accent) !important;
      box-shadow: var(--warning-shadow) !important;
    }
    .signal-lost .status-box {
      color: var(--warning-accent) !important;
    }
  </style>
</head>
<body>
  <div class="status-container" id="card">
    <div class="header">
      <h1>Jan Brunclík</h1>
      <p>PRAŽSKÝ IRL SUBATHON</p>
    </div>
    <div class="status-box" id="mainText">
      VÝPADEK SIGNÁLU
    </div>
    <div class="subtext" id="subText">
      OBNOVUJI SPOJENÍ<span class="dots"><span class="dot dot1">.</span><span class="dot dot2">.</span><span class="dot dot3">.</span></span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const card = document.getElementById('card');
    const header = document.querySelector('.header');
    const mainText = document.getElementById('mainText');
    const subText = document.getElementById('subText');

    // Skrytí horního jména, pokud je v URL ?cloud
    if (params.has('cloud')) {
      if (header) header.style.display = 'none';
    }

    // Nastavení textů a stylů podle parametru ?stav=
    const stav = params.get('stav') || 'signal';

    if (stav === 'signal') {
      card.classList.add('signal-lost');
      mainText.textContent = 'VÝPADEK SIGNÁLU';
      subText.innerHTML = 'OBNOVUJI SPOJENÍ<span class="dots"><span class="dot dot1">.</span><span class="dot dot2">.</span><span class="dot dot3">.</span></span>';
    } else if (stav === 'start') {
      mainText.textContent = 'STREAM BRZY ZAČNE';
      subText.innerHTML = 'PŘIPRAVTE SE<span class="dots"><span class="dot dot1">.</span><span class="dot dot2">.</span><span class="dot dot3">.</span></span>';
    } else if (stav === 'konec') {
      mainText.textContent = 'DÍKY ZA SLEDOVÁNÍ';
      subText.innerHTML = 'STREAM JE U KONCE';
    }
  </script>
</body>
</html>
