<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Start Countdown</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color-dark: rgba(18, 18, 18, 0.9);
      --primary-accent: #00ff00;
      --secondary-accent: #00cccc;
      --text-color: #ffffff;
      --sub-text-color: #cccccc;
      --neon-shadow: 0 0 10px rgba(0, 255, 0, 0.7), 0 0 20px rgba(0, 255, 0, 0.5), 0 0 30px rgba(0, 255, 0, 0.3);
      --inner-shadow-color: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: transparent;
      color: var(--text-color);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }
    .countdown-container {
    text-align: center;
    background: #0e0e0e; /* 100% neprůhledné, zakryje text pod tím */
    padding: 30px 45px;
    border-radius: 20px;
    border: 2px solid var(--inner-shadow-color);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    position: relative;
    transform: scale(1.35); /* Zvětší celou kartu o 35 % */
    }
    .countdown-container::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 2px solid var(--primary-accent);
      border-radius: 25px;
      box-shadow: var(--neon-shadow);
      z-index: -1;
      opacity: 0.8;
      pointer-events: none;
    }
    .header h1 {
      font-size: 1.6em;
      margin: 0;
      color: var(--primary-accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      text-shadow: 0 0 10px var(--primary-accent);
    }
    .header p {
      font-size: 0.8em;
      color: var(--text-color);
      margin: 4px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
    }
    .counter-box {
      font-weight: 700;
      font-size: 3.2em;
      color: var(--text-color);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 8px 25px;
      display: inline-flex;
      gap: 15px;
      margin: 15px 0;
      position: relative;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
    }
    .counter-box::after {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border: 2px solid var(--primary-accent);
      border-radius: 12px;
      box-shadow: var(--neon-shadow);
      z-index: -1;
      opacity: 0.6;
    }
    .count-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .count-unit span.time {
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
    }
    .count-unit span.label {
      font-size: 0.22em;
      color: var(--sub-text-color);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: -5px;
      font-weight: 400;
    }
    .separator {
      font-size: 0.8em;
      line-height: 1;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 8px;
    }
    .status {
      font-size: 0.95em;
      color: var(--text-color);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }
    .dots {
      display: inline-block;
      width: 1.5em;
      text-align: left;
    }
    .dot {
      opacity: 0;
      animation: dot-pulse 1.5s infinite;
    }
    .dot1 { animation-delay: 0s; }
    .dot2 { animation-delay: 0.3s; }
    .dot3 { animation-delay: 0.6s; }
    @keyframes dot-pulse {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="countdown-container">
    <div class="header">
      <h1>Jan Brunclík</h1>
      <p>PRAŽSKÝ IRL SUBATHON</p>
    </div>
    <div class="counter-box">
      <div class="count-unit">
        <span class="time" id="minutes">15</span>
        <span class="label">Minuty</span>
      </div>
      <div class="separator">:</div>
      <div class="count-unit">
        <span class="time" id="seconds">00</span>
        <span class="label">Sekundy</span>
      </div>
    </div>
    <div class="status">
      PŘIPOJUJI SE ZA OKAMŽIK<span class="dots"><span class="dot dot1">.</span><span class="dot dot2">.</span><span class="dot dot3">.</span></span>
    </div>
  </div>

  <script>
    let totalSeconds = 15 * 60;
    const mEl = document.getElementById('minutes');
    const sEl = document.getElementById('seconds');
    const stEl = document.querySelector('.status');

    function tick() {
      if (totalSeconds <= 0) {
        mEl.textContent = '00';
        sEl.textContent = '00';
        stEl.textContent = 'STREAM STARTUJE!';
        clearInterval(timerInterval);
        return;
      }
      totalSeconds--;
      let m = Math.floor(totalSeconds / 60);
      let s = totalSeconds % 60;
      mEl.textContent = m < 10 ? '0' + m : m;
      sEl.textContent = s < 10 ? '0' + s : s;
    }

    const timerInterval = setInterval(tick, 1000);
  </script>
</body>
</html>
