<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Sleep Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-accent: #00ff00;
      --sleep-accent: #9d4edd;
      --text-color: #ffffff;
      --sub-text-color: #cccccc;
      --neon-shadow: 0 0 10px rgba(0, 255, 0, 0.7), 0 0 20px rgba(0, 255, 0, 0.5);
      --sleep-shadow: 0 0 10px rgba(157, 78, 221, 0.7), 0 0 20px rgba(157, 78, 221, 0.5);
      --inner-shadow-color: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: transparent;
      color: var(--text-color);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }
    .status-container {
      text-align: center;
      background: #0e0e0e !important;
      padding: 30px 45px;
      border-radius: 20px;
      border: 2px solid var(--inner-shadow-color);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
      position: relative;
      transform: scale(1.35);
    }
    .status-container::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border: 2px solid var(--primary-accent);
      border-radius: 25px;
      box-shadow: var(--neon-shadow);
      z-index: -1;
      opacity: 0.8;
      pointer-events: none;
    }
    .header {
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 1.6em;
      margin: 0;
      color: var(--primary-accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      text-shadow: 0 0 10px var(--primary-accent);
    }
    .header p {
      font-size: 0.8em;
      color: var(--text-color);
      margin: 4px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
    }
    .status-box {
      font-weight: 700;
      font-size: 2.2em;
      color: var(--text-color);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 10px 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 10px 0;
      position: relative;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .status-box::after {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border: 2px solid var(--primary-accent);
      border-radius: 12px;
      box-shadow: var(--neon-shadow);
      z-index: -1;
      opacity: 0.6;
    }
    .icon {
      font-size: 0.9em;
      display: inline-block;
      animation: float-moon 3s ease-in-out infinite;
    }
    .subtext {
      font-size: 0.95em;
      color: var(--text-color);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
      margin-top: 10px;
    }
    .zzz {
      display: inline-block;
      letter-spacing: 2px;
      font-weight: 700;
      color: var(--primary-accent);
    }
    .z-letter {
      opacity: 0;
      display: inline-block;
      animation: zzz-fade 2s infinite;
    }
    .z1 { animation-delay: 0s; font-size: 0.85em; }
    .z2 { animation-delay: 0.4s; font-size: 1.05em; }
    .z3 { animation-delay: 0.8s; font-size: 1.25em; }

    @keyframes float-moon {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(-5deg); }
    }

    @keyframes zzz-fade {
      0% { opacity: 0; transform: translateY(2px); }
      50% { opacity: 1; transform: translateY(-3px); }
      100% { opacity: 0; transform: translateY(-6px); }
    }

    /* noční fialový neonový režim při použití parametru ?fialova */
    .purple-mode::after, .purple-mode .status-box::after {
      border-color: var(--sleep-accent) !important;
      box-shadow: var(--sleep-shadow) !important;
    }
    .purple-mode .zzz, .purple-mode .header h1 {
      color: var(--sleep-accent) !important;
      text-shadow: 0 0 10px var(--sleep-accent) !important;
    }
  </style>
</head>
<body>
  <div class="status-container" id="card">
    <div class="header">
      <h1>Jan Brunclík</h1>
      <p>PRAŽSKÝ IRL SUBATHON</p>
    </div>
    <div class="status-box">
      <span class="icon">🌙</span>
      <span>STREAMER SPÍ</span>
    </div>
    <div class="subtext">
      DOBÍJÍM BATERKY <span class="zzz"><span class="z-letter z1">Z</span><span class="z-letter z2">z</span><span class="z-letter z3">z</span></span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const header = document.querySelector('.header');
    const card = document.getElementById('card');

    // Skrytí horního jména, pokud je v URL ?cloud
    if (params.has('cloud')) {
      if (header) header.style.display = 'none';
    }

    // Možnost přepnout neon do noční fialové přes parametr ?fialova
    if (params.has('fialova')) {
      card.classList.add('purple-mode');
    }
  </script>
</body>
</html>
